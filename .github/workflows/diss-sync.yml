name: DISS sync

# Scarica dal DISS INGV le sorgenti sismogeniche e le schede informative,
# così la webapp le mostra "offline" senza interrogare ogni volta il servizio.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # una volta al mese
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/diss-sync.yml'
      - 'tools/build_diss.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Etichette delle colonne e immagini
        run: |
          set +e
          B=https://diss.ingv.it/mapper
          for f in js.js mapDISS.js mapDISS_sources.js mapDISS_listenerOfSource.js mapDISS_caricaMapper.js; do curl -sSL -m 60 "$B/js/$f" >> alljs.js; echo >> alljs.js; done
          echo "=== assegnazioni colonne"
          grep -n -E "VALUEELEMENT_[A-Za-z]+\"\)\.innerHTML *= *line" alljs.js | sed -E 's/^[0-9]+: *//' | sort -u | head -120
          echo "=== sezioni dei commenti"
          for id in ITCS013 ITIS003 ITDS001 ITSD001; do curl -sSL -m 60 "$B/data/com/${id}COM.txt" -o c.txt -w "$id HTTP %{http_code} %{size_download}\n"; grep -E '^\*\*' c.txt; done
          echo "=== imgContent"
          curl -sSL -m 60 "$B/imgContent.php?idSource=ITCS013&img=P00700&sType=CS" | head -c 2500; echo
          grep -n "ITCS013" <(curl -sSL -m 60 "$B/data/LinkTable.txt") | head
          for t in CSS ISS DSS SDS DSSA; do curl -sSL -m 60 -o /dev/null -w "$t 4web.MID HTTP %{http_code} %{size_download}\n" "$B/data/${t}4web.MID"; done
          curl -sSL -m 60 "$B/data/SDS4web.MID" | head -c 1500; echo
          curl -sSL -m 60 "$B/data/DSS4web.MID" | head -c 1500; echo
