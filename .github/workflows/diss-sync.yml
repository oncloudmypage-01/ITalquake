name: DISS sync

# Scarica dal DISS INGV le sorgenti sismogeniche e le schede informative,
# così la webapp le mostra "offline" senza interrogare ogni volta il servizio.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # una volta al mese
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/diss-sync.yml'
      - 'tools/build_diss.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Esplora il Mapper
        run: |
          set +e
          B=https://diss.ingv.it/mapper
          curl -sSL -m 60 "$B/js/js.js" -o js.js -w "js.js HTTP %{http_code} %{size_download}\n"
          curl -sSL -m 60 "$B/" -o idx.html
          grep -oE 'src="js/[^"]+"' idx.html | sort -u
          for f in $(grep -oE 'src="js/[^"]+"' idx.html | sed 's/src="//;s/"//' | sort -u); do curl -sSL -m 60 "$B/$f" >> alljs.js; done
          cat js.js >> alljs.js
          echo "=== URL/php nel codice"
          grep -oE "['\"][^'\" ]*\.(php|json|txt|html)[^'\" ]*['\"]" alljs.js | sort | uniq -c | sort -rn | head -60
          echo "=== contesti 'source'"
          grep -n -iE "ajax|fetch\(|\.get\(|getJSON|XMLHttp" alljs.js | head -40
          grep -n -iE "source=|sourceID|idsource|Commentary|Summary|References" alljs.js | head -40
