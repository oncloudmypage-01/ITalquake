name: DISS sync

# Scarica dal DISS INGV le sorgenti sismogeniche e le schede informative,
# così la webapp le mostra "offline" senza interrogare ogni volta il servizio.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # una volta al mese
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/diss-sync.yml'
      - 'tools/build_diss.py'

permissions:
  contents: write

concurrency:
  group: diss-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: pip install pillow
      - name: Scarica i dati del DISS
        run: python tools/build_diss.py
      - name: Salva nel repository
        run: |
          git config user.name "diss-sync[bot]"
          git config user.email "diss-sync@users.noreply.github.com"
          git add diss
          if git diff --cached --quiet; then echo "Nessuna novità dal DISS"; exit 0; fi
          git commit -m "Dati DISS aggiornati ($(date -u +%Y-%m-%d))"
          git push
