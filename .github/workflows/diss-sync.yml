name: DISS sync

# Scarica dal DISS INGV le sorgenti sismogeniche e le schede informative,
# così la webapp le mostra "offline" senza interrogare ogni volta il servizio.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # una volta al mese
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/diss-sync.yml'
      - 'tools/build_diss.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Esplora i file dati del Mapper
        run: |
          set +e
          B=https://diss.ingv.it/mapper
          for f in js.js mapDISS.js mapDISS_sources.js mapDISS_listenerOfSource.js mapDISS_caricaMapper.js hist.js strum.js; do curl -sSL -m 60 "$B/js/$f" >> alljs.js; echo >> alljs.js; done
          echo "=== codice generalInfo/commentary/picture/references"
          awk '/function generalInfo/,0' alljs.js | head -330
          echo "=== showPicture"
          awk '/function showPicture/,/^}/' alljs.js | head -60
          for f in data/com/ITCS013COM.txt data/MainTable.txt data/LinkTable.txt data/ContComp4web.txt data/AssignReferences4web.txt data/Assign_ISS.txt data/CSSTOP4web.MID data/CSSPLN4web.MID data/ISS4web.MID CPTI-CFTI.txt data/CPTI-CFTI.txt; do
            echo "=== $f"; curl -sSL -m 60 "$B/$f" -o t.txt -w "HTTP %{http_code} %{size_download}\n"; head -c 1800 t.txt; echo
          done
