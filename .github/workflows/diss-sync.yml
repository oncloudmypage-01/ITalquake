name: DISS sync

# Scarica dal DISS INGV le sorgenti sismogeniche e le schede informative,
# così la webapp le mostra "offline" senza interrogare ogni volta il servizio.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # una volta al mese
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/diss-sync.yml'
      - 'tools/build_diss.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Esplora una scheda sorgente
        run: |
          set +e
          for id in ITCS013 ITIS027; do
            echo "=== $id"
            curl -sSL -m 60 "https://diss.ingv.it/diss331/sources.php?$id" -o p.html -w "HTTP %{http_code} %{size_download}\n"
            grep -oiE '<(h[1-6]|table|div|td|th|img|a)[^>]*(id|class|src|href)="[^"]*"' p.html | sort | uniq -c | sort -rn | head -60
            python3 - <<'PY'
          import re,html
          t=open('p.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'(?is)<(script|style).*?</\1>','',t)
          t=re.sub(r'(?i)<br\s*/?>','\n',t)
          t=re.sub(r'(?i)</(p|div|tr|h[1-6]|li|table)>','\n',t)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t))
          t=re.sub(r'[ \t]+',' ',t); t=re.sub(r'\n\s*\n+','\n',t)
          print(t[:6000])
          PY
          done
