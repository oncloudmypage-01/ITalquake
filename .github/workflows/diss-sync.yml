name: DISS sync

# Scarica dal DISS INGV le sorgenti sismogeniche e le schede informative,
# così la webapp le mostra "offline" senza interrogare ogni volta il servizio.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # una volta al mese
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/diss-sync.yml'
      - 'tools/build_diss.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Esplora gli attributi
        run: |
          set +e
          W="https://services.seismofaults.eu/DISS331/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json"
          for L in csspln331 csstop331 iss331 dss331 subdzon331; do
            echo "=== $L"
            curl -sSL -m 120 "$W&typeNames=DISS331:$L" -o $L.json -w "HTTP %{http_code} %{size_download}\n"
            python3 - "$L.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          f=d.get('features',[])
          print('features',len(f),'crs',d.get('crs'))
          if f:
            print('geom',f[0]['geometry']['type'])
            print(json.dumps(f[0]['properties'],ensure_ascii=False)[:3000])
          PY
          done
          echo "=== link nella pagina download"
          curl -sSL -m 60 https://diss.ingv.it/download-diss-3-3-1 | grep -oiE 'href="[^"]+"' | sort -u | head -80
