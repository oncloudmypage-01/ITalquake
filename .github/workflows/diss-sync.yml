name: DISS sync

# Scarica dal DISS INGV le sorgenti sismogeniche e le schede informative,
# così la webapp le mostra "offline" senza interrogare ogni volta il servizio.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # una volta al mese
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/diss-sync.yml'
      - 'tools/build_diss.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Esplora una scheda sorgente (raw)
        run: |
          set +e
          curl -sS -m 60 -D - "https://diss.ingv.it/diss331/sources.php?ITCS013" -o p.html; echo; cat p.html; echo
          for u in "https://diss.ingv.it/diss331/sources.php?ITCS013" "https://diss.ingv.it/diss331/" "https://diss.ingv.it/diss331/index.php"; do
            echo "=== $u (browser UA, follow)"
            curl -sSL -m 60 -A "Mozilla/5.0 (Linux; Android 14) Chrome/130 Mobile" -c cj.txt -b cj.txt "$u" -o q.html -w "HTTP %{http_code} %{size_download} %{url_effective}\n"
            head -c 1500 q.html; echo
            grep -oiE '(src|href)="[^"]+"' q.html | sort -u | head -40
          done
