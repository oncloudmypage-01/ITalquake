name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive

  # Le funzioni del server (notifiche push terremoti e stima provvisoria) vengono
  # pubblicate solo quando cambia la cartella functions/: niente più comando a mano.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Controlla se le funzioni sono cambiate
        id: chg
        run: |
          if git diff --quiet HEAD~1 HEAD -- functions/; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.chg.outputs.changed == 'true'
        with:
          node-version: '22'
      - name: Installa le dipendenze delle funzioni
        if: steps.chg.outputs.changed == 'true'
        run: npm install --prefix functions
      - name: Pubblica le funzioni
        if: steps.chg.outputs.changed == 'true'
        run: |
          npm install -g firebase-tools
          firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive --force
