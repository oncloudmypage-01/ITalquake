name: Probe INGV (temporaneo)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-ingv.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Contesto "stima provvisoria" nella home
        run: |
          curl -sL -A 'Mozilla/5.0' https://terremoti.ingv.it/ -o home.html
          python3 - <<'PY'
          import re
          h=open('home.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'(?i)provvis',h):
              print('=====',m.start()); print(h[max(0,m.start()-700):m.start()+900]); print()
          for u in sorted(set(re.findall(r'''["'](https?://[^"' ]*(?:json|api|alert|provv|ajax)[^"' ]*)["']''',h))): print('URL',u)
          for u in sorted(set(re.findall(r'''(?:url|href|src)\s*[:=]\s*["']([^"']+)["']''',h)))[:80]: print('REF',u)
          PY
