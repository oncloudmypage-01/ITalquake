name: Probe INGV (temporaneo)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-ingv.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Versioni degli eventi FDSN
        run: |
          S=$(date -u -d '-3 days' +%Y-%m-%dT%H:%M:%S)
          B='https://webservices.ingv.it/fdsnws/event/1/query'
          echo '=== geojson ultimi eventi (proprietà)'; curl -s "$B?format=geojson&limit=3&orderby=time" | head -c 2500; echo
          for q in "maxversion=99" "maxversion=50" "minversion=0&maxversion=10" "minversion=100&maxversion=100" "minversion=101"; do
            echo "=== $q"; curl -s -w '\nHTTP %{http_code}\n' "$B?format=text&starttime=$S&orderby=time&limit=8&$q" | head -12
          done
          echo '=== distribuzione version ultimi 3 giorni M>=2'
          curl -s "$B?format=geojson&starttime=$S&minmag=2&limit=500" | python3 -c "
          import json,sys,collections
          d=json.load(sys.stdin); c=collections.Counter(f['properties'].get('version') for f in d['features']); print(c)
          for f in d['features'][:6]: print({k:f['properties'].get(k) for k in ('eventId','time','mag','magType','place','version','author','type')})"
      - name: Pagina eventi (struttura righe) e feed
        run: |
          UA='Mozilla/5.0'
          curl -sL -A "$UA" https://terremoti.ingv.it/ -o home.html
          python3 - <<'PY'
          import re
          h=open('home.html',encoding='utf-8',errors='replace').read()
          i=h.find('<tbody'); print(h[i:i+3500])
          for w in ['provvis','Provvis','PROVVIS','preliminar','stima','Stima','alert','in corso','elaborazione']:
              print(w, [m.start() for m in re.finditer(w,h)][:5])
          PY
          echo '=== feed atom'; curl -sL -A "$UA" https://terremoti.ingv.it/feed/atom/all_week | head -c 2500; echo
          echo '=== wayback snapshot con stima provvisoria?'
          curl -s 'https://web.archive.org/cdx/search/cdx?url=terremoti.ingv.it/&output=json&limit=5&from=2025&filter=statuscode:200&collapse=digest' | head -c 1200; echo
