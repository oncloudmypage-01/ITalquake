name: Probe sismografi locali
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-sismo.yml','tools/probe_sismo.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/probe_sismo.py \
            "https://www.orfeus-eu.org/eidaws/routing/1/query?network=GU,IX,IT,OX,ST,SI,NI,RF,BA,VM,OT,AM,BN&format=post" \
            "https://webservices.ingv.it/fdsnws/station/1/query?network=*&level=network&format=text" \
            "https://eida.ogs.it/fdsnws/station/1/query?network=*&level=network&format=text" \
            "https://webservices.ingv.it/fdsnws/station/1/query?network=GU&level=station&format=text" \
            "https://webservices.ingv.it/fdsnws/station/1/query?network=IT&level=station&format=text&minlatitude=40&maxlatitude=41.5&minlongitude=14&maxlongitude=16" \
            "https://eida.ogs.it/fdsnws/station/1/query?network=OX,ST,SI,NI,RF&level=station&format=text" \
            "https://www.fdsn.org/ws/networks/1/query?code=GU" \
            "https://www.fdsn.org/networks/detail/GU/" \
            "https://www.fdsn.org/networks/detail/ST/" \
            "https://www.fdsn.org/networks/detail/OX/" \
            "https://www.fdsn.org/networks/detail/IT/" \
            "https://www.fdsn.org/networks/detail/IX/" \
            "https://www.fdsn.org/networks/detail/SI/" \
            "https://www.fdsn.org/networks/detail/RF/" \
            "https://www.fdsn.org/networks/detail/NI/" \
            "https://www.fdsn.org/networks/detail/OT/" \
            "https://www.fdsn.org/networks/detail/BA/" \
            "https://www.fdsn.org/networks/detail/AM/" \
            "https://eida.ingv.it/en/network/GU" \
            "https://eida.ingv.it/en/network/IT" \
            "https://eida.ingv.it/en/network/IX" \
            "https://eida.ingv.it/en/network/OT" \
            "https://eida.ingv.it/en/network/BA" \
            "FULL:https://rete-collalto.crs.inogs.it/pages/termini-utilizzo.html" \
            "FULL:https://rete-collalto.crs.inogs.it/pages/note-legali.html" \
            "FULL:https://nuke.nprotezionecivile.it/Sismogrammiindiretta/tabid/647/ctl/Terms/Default.aspx" \
            "https://nuke.nprotezionecivile.it/drums/bn.bn013.ehz.png" \
            "http://nuke.nprotezionecivile.it/drums/bn.bn013.ehz.png" \
            "https://www.provincia.tn.it/Note-legali-e-privacy" \
            "https://www.provincia.tn.it/Amministrazione/Note-legali" \
            "https://pctrento.it/" \
            "https://manual.raspberryshake.org/licensing.html" \
            "https://data.raspberryshake.org/fdsnws/station/1/query?network=AM&station=RA877,R4E40,R5C0A&level=station&format=text"
