name: Probe sismografi locali
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-sismo.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          get(){ echo; echo "==== $1"; curl -4 -sSL -m 40 -A "Mozilla/5.0" -H "Origin: https://example.github.io" -D hdr.txt "$1" -o out.txt -w "HTTP %{http_code} %{content_type} %{size_download}\n"; grep -iE '^(access-control-allow-origin|content-type|last-modified|cache-control)' hdr.txt; }
          get "https://www.hsit.it/lasthour.html"; grep -oiE '(src|href)="[^"]+"' out.txt | grep -viE 'css|png|svg|html' | sort -u; grep -oiE '.{0,120}(json|xml-server|fetch|ajax|XMLHttp).{0,160}' out.txt | head -20
          for j in lasthour settings setcounter datemanager; do get "https://www.hsit.it/js/$j.js"; head -c 3500 out.txt; echo; done
          get "https://www.hsit.it/json/counter.json"; head -c 600 out.txt
          get "https://www.hsit.it/json/lasthour.json"; head -c 1500 out.txt
          get "https://www.hsit.it/compile.html"; grep -oiE '.{0,100}(eventid|event_id|evid|\?id=|location\.search|getParam).{0,120}' out.txt | head
          E=47861452
          get "https://e.hsit.it/$E/index.html"; sed -e 's/<[^>]*>/ /g' out.txt | tr -s ' \n' ' ' | grep -oiE 'Questionari.{0,160}'
          get "https://e.hsit.it/$E/${E}_mcs_municipality.json"; python3 -c "
          import json;d=json.load(open('out.txt'));q=list(d['Quakes'].values())[0];m=q['MacroseismicData'];print(json.dumps(m['Description'])[:400]);k=list(m['MDPs'].keys());print(len(k));print(json.dumps(m['MDPs'][k[0]],indent=0)[:1500]);print([x for x in q.keys()]);print([x for x in m.keys()])" || head -c 800 out.txt
          get "https://shakemap.ingv.it/js/config-base.js"; head -c 4000 out.txt
          get "https://shakemap.ingv.it/js/config-env.js"; head -c 1500 out.txt
          get "https://shakemap.ingv.it/js/products.js"; grep -oiE '.{0,100}(\.jpg|\.png|\.json|products/|/data/).{0,100}' out.txt | head -20
          get "https://shakemap.ingv.it/js/archive.js"; grep -oiE '.{0,100}(\.json|/data/|fetch\().{0,140}' out.txt | head -15
