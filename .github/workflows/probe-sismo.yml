name: Probe sismografi locali
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-sismo.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          get(){ echo; echo "==== $1"; curl -4 -sSL -m 40 -A "Mozilla/5.0" -H "Origin: https://example.github.io" -D hdr.txt "$1" -o out.txt -w "HTTP %{http_code} %{content_type} %{size_download}\n"; grep -iE '^(access-control-allow-origin|content-type|last-modified)' hdr.txt; }
          get "https://www.hsit.it/lasthour.html"; python3 -c "
          import re;t=open('out.txt').read()
          for m in re.findall(r'<script[^>]*>(.*?)</script>',t,re.S):
            if len(m.strip())>20: print('SCRIPT',m.strip()[:1500])
          i=t.find('Provincia');print(t[i-1500:i+2500])"
          get "https://shakemap.ingv.it/data/events.json"; head -c 900 out.txt; echo
          get "https://shakemap.ingv.it/productsListToProcess.json"; head -c 1500 out.txt; echo
          for p in intensity.jpg intensity_overlay.png info.json; do get "https://shakemap.ingv.it/data/47612622/current/products/$p"; done
          head -c 600 out.txt
