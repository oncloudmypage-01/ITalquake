name: Probe sismografi locali
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-sismo.yml','tools/probe_sismo.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for c in EHZ EHN EHE; do for s in https http; do
            u="$s://meteomio.altervista.org/sismografo/drum_CMVG_$c.gif"
            echo "==== $u"; curl -4 -sS -m 40 -A "Mozilla/5.0" -e "https://example.github.io/" -o x.gif -w "%{http_code} %{content_type} %{size_download} %{redirect_url}\n" "$u"; file x.gif
          done; done
          curl -4 -sSI -m 30 https://meteomio.altervista.org/sismografo/drum_CMVG_EHZ.gif | head -20
          curl -4 -sSL -m 30 -A "Mozilla/5.0" https://www.mvobsv.org/about-us/ | grep -oiE '.{0,200}(copyright|©|diritti|licen|riprodu).{0,200}' | head
