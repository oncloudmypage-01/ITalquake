name: Probe sismografi locali
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-sismo.yml','tools/probe_sismo.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.mvobsv.org/earthquakes/ http://www.mvobsv.org/earthquakes/ https://mvobsv.org/earthquakes/; do
            echo "==== $u"; dig +short www.mvobsv.org A; dig +short www.mvobsv.org AAAA
            curl -4 -sSL -m 40 -A "Mozilla/5.0" -D - "$u" -o page.html && sed -e 's/<script[^>]*>.*<\/script>//g' page.html | grep -oiE '(src|href|data-src)="[^"]+"' | grep -viE '\.css|\.js|wp-includes|fonts' | sort -u | head -80
            grep -oiE '.{0,200}(copyright|©|licen|riprodu|raspberry|shake|sismograf|seismo|stazione|AM\.|R[0-9A-F]{4}).{0,200}' page.html | head -40
            [ -s page.html ] && break
          done
