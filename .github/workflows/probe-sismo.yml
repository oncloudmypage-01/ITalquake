name: Probe sismografi locali
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-sismo.yml','tools/probe_sismo.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/probe_sismo.py \
            "FULL:https://rete-cornegliano.crs.inogs.it/assets/helicorder/rt/index.html" \
            "https://rete-collalto.crs.inogs.it/DATI/helicorder/rt/ED01_z_hp-heli.png" \
            "FULL:https://rete-collalto.crs.inogs.it/DATI/helicorder/rt/DbheliTable_readme_it.php" \
            "https://rete-collalto.crs.inogs.it/pages/descrizione-stazioni.html" \
            "https://webservices.ingv.it/fdsnws/station/1/query?network=EV&level=station&format=text" \
            "https://www.orfeus-eu.org/eidaws/routing/1/query?network=EV,OL&format=post"
