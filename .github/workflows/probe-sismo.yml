name: Probe sismografi locali
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-sismo.yml','tools/probe_sismo.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/probe_sismo.py \
            "https://webservices.ingv.it/fdsnws/station/1/query?network=OX,ST,SI,NI,RF,VM,BA,IX,OT&level=station&format=text" \
            "https://webservices.ingv.it/fdsnws/availability/1/extent?network=GU,OX,ST,SI,NI,RF,VM,IX,OT&channel=HHZ,EHZ,HNZ&format=text&merge=samplerate,quality&orderby=latestupdate_desc&limit=400" \
            "https://eida.ingv.it/en/policy" \
            "https://eida.ingv.it/en/data-policy" \
            "https://eida.ingv.it/en/" \
            "https://www.orfeus-eu.org/data/eida/policy/" \
            "https://www.orfeus-eu.org/data/policy/"
