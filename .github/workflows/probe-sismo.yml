name: Probe sismografi locali
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-sismo.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          get(){ echo; echo "==== $1"; curl -4 -sSL -m 40 -A "Mozilla/5.0" -H "Origin: https://example.github.io" -D hdr.txt "$1" -o out.txt -w "HTTP %{http_code} %{content_type} %{size_download} %{url_effective}\n"; grep -iE '^(access-control|x-frame|content-type)' hdr.txt; }
          show(){ sed -e 's/<script/\n<script/g' out.txt | head -c ${1:-3000}; echo; }
          # ultimi eventi M>=3 per avere degli id
          get "https://webservices.ingv.it/fdsnws/event/1/query?format=text&minmag=3&starttime=2026-09-01&orderby=time&limit=5"; show 1500
          ID=$(grep -v '^#' out.txt | head -1 | cut -d'|' -f1); echo "ID=$ID"
          get "https://www.hsit.it/"; show 4000
          grep -oiE '(href|src|action)="[^"]+"' out.txt | sort -u | head -60
          get "https://www.hsit.it/eventi"; show 2500
          get "https://www.hsit.it/api/"; show 1500
          get "https://terremoti.ingv.it/event/$ID"; grep -oiE '[^"]*(hsit|shakemap|questionari|felt)[^"]*' out.txt | sort -u | head -30
          get "https://terremoti.ingv.it/event/$ID?tab=HaiSentitoIlTerremoto"; grep -oiE '[^"<>]*(hsit|questionari|intensit|json|api)[^"<>]*' out.txt | sort -u | head -40
          get "https://shakemap.ingv.it/shake4/data/$ID/current/products/intensity.jpg"
          get "https://shakemap.ingv.it/shake4/data/$ID/current/products/info.json"; show 800
          get "https://shakemap.ingv.it/shake4/viewLeaflet.html?eventid=$ID"; show 1500
          get "https://shakemap.ingv.it/"; grep -oiE '(href|src)="[^"]+"' out.txt | sort -u | head -30
          get "https://webservices.ingv.it/fdsnws/event/1/query?eventid=$ID&format=xml&includeallorigins=false"; grep -oiE '.{0,80}(hsit|shakemap|felt|intensity).{0,120}' out.txt | head
